<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Perangkat Daerah Kota Bekasi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:28px 18px 48px}.title{margin-bottom:18px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#0b3d91}.title h1{margin:7px 0 5px;font-size:30px;line-height:1.15}.title p{margin:0;color:#667085;font-size:14px}
.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0 16px}.search{flex:1;padding:11px 13px;border:1px solid #dfe5ef;border-radius:10px;background:#fff;font:inherit;font-size:13px;outline:none}.search:focus{border-color:#0b3d91;box-shadow:0 0 0 3px rgba(11,61,145,.1)}.count{font-size:12px;color:#667085;font-weight:700;white-space:nowrap}
.stats{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 24px}.stat{padding:9px 13px;border:1px solid #dfe5ef;border-radius:11px;background:#fff;color:#344054;text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}.stat:hover{border-color:#0b3d91}.stat.active{border-color:#0b3d91;background:#0b3d91;color:#fff}.stat b{margin-left:5px}
.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:38px 1fr;gap:14px;align-items:start;background:#fff;border:1px solid #e4e8f0;border-radius:14px;padding:15px;text-decoration:none;color:inherit;cursor:pointer;transition:.15s}.item:hover{border-color:#0b3d91;box-shadow:0 5px 16px rgba(16,24,40,.09);transform:translateY(-1px)}.num{width:34px;height:34px;border-radius:10px;background:#eef4ff;color:#0b3d91;display:grid;place-items:center;font-size:12px;font-weight:800}.body h2{margin:0;font-size:16px;line-height:1.35}.host{margin-top:3px;font-size:12px;color:#0b3d91;font-weight:700}.body p{margin:7px 0 0;color:#667085;font-size:13px;line-height:1.5}
.empty{padding:30px;text-align:center;color:#667085;background:#fff;border:1px solid #e4e8f0;border-radius:14px}
@media(max-width:640px){.wrap{padding:20px 12px 36px}.title h1{font-size:25px}.toolbar{align-items:stretch;flex-direction:column}.count{align-self:flex-start}.item{grid-template-columns:32px 1fr}.num{width:30px;height:30px}}
</style>
</head>
<body>
<main class="wrap">
<section class="title">
<div class="eyebrow">Pemerintah Kota Bekasi</div>
<h1>Website Perangkat Daerah</h1>
<p>Daftar domain aktif yang digunakan, berdasarkan data PSW.</p>
</section>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="Cari nama atau domain..." autocomplete="off"><span id="count" class="count"></span></div>
<nav id="filters" class="stats" aria-label="Filter kategori"></nav>
<section id="list" class="list" aria-label="Daftar website Perangkat Daerah"></section>
</main>
<script>
const DATA_URL='./bekasi-opd.json?v=096b31b';
const CATEGORIES=['Semua','Portal Utama','OPD','Kecamatan','Kelurahan','Puskesmas'];
let data=[],query='',category='Semua';
const list=document.getElementById('list'),search=document.getElementById('search'),count=document.getElementById('count'),filters=document.getElementById('filters');
function renderFilters(){filters.innerHTML=CATEGORIES.map((cat,i)=>{const n=cat==='Semua'?data.length:data.filter(x=>x.category===cat).length;return '<button type="button" class="stat '+(i===0?'active':'')+'" data-cat="'+cat+'">'+cat+' <b>'+n+'</b></button>'}).join('');filters.querySelectorAll('.stat').forEach(b=>b.addEventListener('click',()=>{category=b.dataset.cat;filters.querySelectorAll('.stat').forEach(x=>x.classList.toggle('active',x===b));render()}))}
function render(){const q=query.toLowerCase().trim();const shown=data.filter(x=>(category==='Semua'||x.category===category)&&(!q||[x.name,x.host].join(' ').toLowerCase().includes(q)));count.textContent=shown.length+' dari '+data.length+' website';list.innerHTML=shown.length?shown.map((x,i)=>'<a class="item" href="'+x.url+'" target="_blank" rel="noopener noreferrer"><div class="num">'+(data.indexOf(x)+1)+'</div><div class="body"><h2>'+esc(x.name)+'</h2><div class="host">'+esc(x.host)+'</div></div></a>').join(''):'<div class="empty">Tidak ada website yang cocok.</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
search.addEventListener('input',e=>{query=e.target.value;render()});
fetch(DATA_URL).then(r=>r.json()).then(x=>{data=x;renderFilters();render()}).catch(()=>{list.innerHTML='<div class="empty">Data OPD gagal dimuat.</div>'});
</script>
</body>
</html>
