<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>e-OPen — Buka di Browser</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background:
            radial-gradient(circle at 20% 10%, rgba(59,130,246,.20), transparent 32%),
            radial-gradient(circle at 85% 85%, rgba(99,102,241,.18), transparent 34%),
            #080c18;
        color: #eef2ff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: hidden;
    }

    .orb {
        position: fixed;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background: rgba(37,99,235,.12);
        filter: blur(70px);
        pointer-events: none;
    }
    .orb.one { top: -100px; left: -80px; }
    .orb.two { right: -100px; bottom: -100px; background: rgba(124,58,237,.12); }

    .card {
        width: min(430px, 100%);
        position: relative;
        background: rgba(15,23,42,.78);
        border: 1px solid rgba(148,163,184,.16);
        border-radius: 28px;
        padding: 34px 26px 25px;
        text-align: center;
        box-shadow: 0 25px 80px rgba(0,0,0,.45);
        backdrop-filter: blur(18px);
    }

    .icon {
        width: 76px;
        height: 76px;
        margin: 0 auto 20px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #2563eb, #4f46e5);
        box-shadow: 0 14px 35px rgba(37,99,235,.28);
        font-size: 36px;
    }

    h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: -.5px;
    }

    .subtitle {
        margin: 11px auto 25px;
        color: #aab4c8;
        line-height: 1.55;
        font-size: 14px;
        max-width: 330px;
    }

    .url {
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        padding: 13px 15px;
        margin-bottom: 15px;
        border-radius: 14px;
        background: rgba(2,6,23,.48);
        border: 1px solid rgba(148,163,184,.12);
        color: #dbeafe;
        font-size: 13px;
    }

    .url span:first-child { font-size: 18px; }
    .url strong { display: block; font-weight: 600; }
    .url small { color: #7f8ba3; }

    button {
        width: 100%;
        border: 0;
        border-radius: 15px;
        padding: 15px 18px;
        color: white;
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 12px 30px rgba(37,99,235,.25);
        transition: transform .15s ease, filter .15s ease;
    }

    button:active { transform: scale(.98); }
    button:hover { filter: brightness(1.08); }

    .secondary {
        margin-top: 12px;
        color: #8e9ab0;
        font-size: 12px;
        line-height: 1.5;
    }

    .status {
        display: none;
        margin-top: 16px;
        padding: 11px 13px;
        border-radius: 12px;
        background: rgba(30,41,59,.7);
        color: #cbd5e1;
        font-size: 12px;
    }

    .footer {
        margin-top: 22px;
        color: #58657c;
        font-size: 11px;
    }
</style>
</head>

<body>
<div class="orb one"></div>
<div class="orb two"></div>

<main class="card">
    <div class="icon">🌐</div>

    <h1>Buka e-OPen</h1>

    <p class="subtitle">
        e-OPen perlu dibuka menggunakan browser eksternal.
        Tekan tombol di bawah untuk melanjutkan.
    </p>

    <div class="url">
        <span>🔗</span>
        <div>
            <strong>e-open.id</strong>
            <small>Portal e-OPen</small>
        </div>
    </div>

    <button id="openBtn" onclick="openEopen()">
        Buka e-OPen di Browser
    </button>

    <div id="status" class="status">
        Membuka browser eksternal…
    </div>

    <div class="secondary">
        Jika browser tidak terbuka otomatis, tekan tombol sekali lagi.
    </div>

    <div class="footer">
        Secure external browser launcher
    </div>
</main>

<script>
const TARGET = "https://e-open.id/";

function openEopen() {
    const status = document.getElementById("status");
    const button = document.getElementById("openBtn");

    status.style.display = "block";
    button.textContent = "Membuka…";

    // Android Intent: minta Android menangani URL melalui aplikasi eksternal.
    const intent =
        "intent://e-open.id/#Intent;" +
        "scheme=https;" +
        "action=android.intent.action.VIEW;" +
        "category=android.intent.category.BROWSABLE;" +
        "end";

    try {
        window.location.href = intent;
    } catch (e) {
        // Fallback jika intent tidak didukung.
        window.location.href = TARGET;
    }

    // Fallback tambahan untuk WebView yang tidak menjalankan intent://.
    setTimeout(() => {
        if (!document.hidden) {
            window.location.href = TARGET;
        }
    }, 1800);
}
</script>
</body>
</html>
